<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Noor ❤️</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ff4d6d;
}

h1{
    color:#ff4d6d;
}

p{
    color:#444;
    font-size:18px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
    <img src="IMG20260329_214354_767.jpg" alt="Noor">

    <h1>❤️ For My Noor ❤️</h1>

    <p>
        Kuch log sirf zindagi ka hissa hote hain,
        aur kuch poori zindagi ban jaate hain.<br><br>

        Mere liye tum wahi ho. ❤️<br><br>

        Chahe kitni bhi dooriyan aa jaayein,
        meri duaon mein hamesha tum hi rahogi.
    </p>
</div>

</body>
</html>
